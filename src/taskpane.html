<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email to Markdown</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1b1b1b;
      background: #faf9f8;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px 0;
    }
    p.sub {
      font-size: 12px;
      color: #666;
      margin: 0 0 16px 0;
    }
    label {
      display: block;
      font-size: 12px;
      margin: 10px 0 4px 0;
    }
    select {
      width: 100%;
      padding: 4px;
      font-size: 13px;
    }
    button#export-btn {
      margin-top: 18px;
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: #2b579a;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    button#export-btn:hover { background: #1e3f73; }
    button#export-btn:disabled { background: #a3a3a3; cursor: default; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 16px;
    }
    #status.error { color: #b3261e; }
    #status.ok { color: #146c2e; }
  </style>
</head>
<body>
  <h1>Export to Markdown</h1>
  <p class="sub">Converts the open email's headers and formatted body (tables, lists, bold, italic, underline) to a .md file.</p>

  <label for="underline-mode">Underline handling</label>
  <select id="underline-mode">
    <option value="html">Keep as inline HTML &lt;u&gt;text&lt;/u&gt; (renders in GitHub/Obsidian/VS Code)</option>
    <option value="bold">Convert to bold as a substitute</option>
    <option value="drop">Drop underline formatting</option>
  </select>

  <button id="export-btn">Export this email to Markdown</button>
  <button id="debug-btn" style="margin-top:6px;width:100%;padding:6px 12px;font-size:12px;background:#eee;border:1px solid #ccc;border-radius:3px;cursor:pointer;">Download raw HTML (debug)</button>
  <div id="status"></div>

  <script>
    Office.onReady(() => {
      document.getElementById("export-btn").onclick = exportEmail;
      document.getElementById("debug-btn").onclick = downloadRawHtml;
    });

    function setStatus(msg, cls) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = cls || "";
    }

    function sanitizeFilename(name) {
      return (name || "untitled")
        .replace(/[\\/:*?"<>|]/g, "-")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 120);
    }

    function formatRecipients(list) {
      if (!list || list.length === 0) return "";
      return list.map(r => (r.displayName ? `${r.displayName} <${r.emailAddress}>` : r.emailAddress)).join(", ");
    }

    function yamlEscape(str) {
      if (!str) return '""';
      return '"' + String(str).replace(/"/g, '\\"') + '"';
    }

    function buildFrontmatter(item) {
      const to = formatRecipients(item.to);
      const cc = formatRecipients(item.cc);
      const from = item.from ? (item.from.displayName ? `${item.from.displayName} <${item.from.emailAddress}>` : item.from.emailAddress) : "";
      const date = item.dateTimeCreated ? item.dateTimeCreated.toISOString() : "";

      let fm = "---\n";
      fm += `subject: ${yamlEscape(item.subject)}\n`;
      fm += `from: ${yamlEscape(from)}\n`;
      fm += `to: ${yamlEscape(to)}\n`;
      if (cc) fm += `cc: ${yamlEscape(cc)}\n`;
      fm += `date: ${yamlEscape(date)}\n`;
      fm += "---\n\n";
      return fm;
    }

    // Outlook wraps each visual line of text in a block-level element - Word/
    // desktop uses <p class="MsoNormal">, New Outlook's own compose editor
    // uses plain <div dir="ltr" style="...">. Turndown treats any block-level
    // element the same way (wrapped in a blank-line paragraph break by
    // default), regardless of which tag Outlook happened to use, which causes
    // two related problems: (1) tight visual lines that belong to the same
    // paragraph get inflated into separate blank-line-separated paragraphs,
    // and (2) inside a table cell, that same blank-line wrapping breaks GFM's
    // pipe-table row assembly entirely.
    //
    // A "line" is defined here as a <p> or <div> with no further <p>/<div>
    // nested inside it - i.e. an element that directly contains one visual
    // line of content, not a wrapper around other lines. That single
    // definition covers Word's <p>, New Outlook's <div>, and any similar
    // variant Outlook introduces later without needing a new special case
    // each time.
    function mergeTightParagraphs(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const lineSelector = "p, div";

      function isLineElement(el) {
        return !!el && (el.tagName === "P" || el.tagName === "DIV") && !el.querySelector(lineSelector);
      }
      function isEmptyLine(el) {
        return isLineElement(el) && el.textContent.replace(/\u00A0/g, "").trim().length === 0;
      }

      // Top-level content: merge runs of consecutive non-empty sibling lines
      // (joined by <br>, preserving them as one visual paragraph) and drop
      // empty spacer lines (their job of creating separation is preserved
      // simply by the remaining lines staying as distinct elements).
      function processElement(parent) {
        Array.from(parent.children).forEach(child => {
          // Table internals are handled separately below - skip to avoid
          // double-processing lines that live inside cells.
          if (!isLineElement(child) && child.tagName !== "TABLE") processElement(child);
        });

        const children = Array.from(parent.children);
        let i = 0;
        while (i < children.length) {
          const el = children[i];
          if (isLineElement(el) && !isEmptyLine(el)) {
            let j = i + 1;
            const run = [el];
            while (j < children.length && isLineElement(children[j]) && !isEmptyLine(children[j])) {
              run.push(children[j]);
              j++;
            }
            for (let k = 1; k < run.length; k++) {
              run[0].appendChild(doc.createElement("br"));
              while (run[k].firstChild) run[0].appendChild(run[k].firstChild);
              run[k].remove();
            }
            i = j;
          } else {
            if (isEmptyLine(el)) el.remove();
            i++;
          }
        }
      }
      processElement(doc.body);

      // Table cells: flatten all lines within a cell into one inline sequence
      // joined by <br>, since a GFM table cell must be single-line content -
      // there's no "separate paragraph" concept possible inside a cell the
      // way there is at the top level.
      //
      // Only do this for tables with a genuine header row (matching the same
      // check turndown-plugin-gfm itself uses to decide whether a table is
      // convertible at all). Headerless tables fall back to being kept as raw
      // HTML verbatim - flattening their cells here would quietly mutate that
      // "kept" HTML before Turndown ever sees it, breaking the byte-for-byte
      // losslessness that fallback is supposed to guarantee.
      function tableHasHeaderRow(table) {
        const firstRow = table.rows && table.rows[0];
        if (!firstRow) return false;
        if (firstRow.parentNode && firstRow.parentNode.nodeName === "THEAD") return true;
        return Array.from(firstRow.cells).every(cell => cell.nodeName === "TH");
      }

      doc.querySelectorAll("table").forEach(function (table) {
        if (!tableHasHeaderRow(table)) return;
        table.querySelectorAll("td, th").forEach(function (cell) {
          const lines = Array.from(cell.querySelectorAll(lineSelector)).filter(el => !el.querySelector(lineSelector));
          if (lines.length === 0) return;
          const fragment = doc.createDocumentFragment();
          let appended = false;
          lines.forEach(function (line) {
            if (!line.textContent.trim()) return; // skip empty spacer lines within a cell
            if (appended) fragment.appendChild(doc.createElement("br"));
            while (line.firstChild) fragment.appendChild(line.firstChild);
            appended = true;
          });
          cell.innerHTML = "";
          cell.appendChild(fragment);
        });
      });

      return doc.body.innerHTML;
    }

    function convertHtmlToMarkdown(html, underlineMode) {
      const turndownService = new TurndownService({
        headingStyle: "atx",
        codeBlockStyle: "fenced",
        bulletListMarker: "-"
      });
      turndownService.use(turndownPluginGfm.gfm); // tables, strikethrough, task lists

      // Word often puts a <br> as the last child inside <b>/<strong> (e.g. a bold
      // header line immediately followed by a line break, still inside the bold
      // tag). Turndown's default rule wraps the whole converted content - break
      // included - in ** ... **, so the closing ** ends up at the start of the
      // next line, preceded by whitespace. Per CommonMark's flanking-delimiter
      // rule, a closing ** preceded by whitespace can't close emphasis, so it
      // prints as a literal **. This pulls any leading/trailing line break out
      // of the wrapped content so the delimiters always sit flush against text.
      function flankingSafeRule(tags, delimiterOption) {
        return {
          filter: tags,
          replacement: function (content, node, options) {
            if (!content.trim()) return "";
            const delimiter = options[delimiterOption];
            const leadingMatch = content.match(/^(?:\n[ \t]*)+/);
            const trailingMatch = content.match(/(?:[ \t]*\n)+$/);
            const leading = leadingMatch ? leadingMatch[0] : "";
            const trailing = trailingMatch ? trailingMatch[0] : "";
            const core = content.slice(leading.length, content.length - trailing.length);
            if (!core.trim()) return content;
            return leading + delimiter + core + delimiter + trailing;
          }
        };
      }
      turndownService.addRule("strongFlankingSafe", flankingSafeRule(["strong", "b"], "strongDelimiter"));
      turndownService.addRule("emFlankingSafe", flankingSafeRule(["em", "i"], "emDelimiter"));

      turndownService.addRule("underline", {
        filter: ["u"],
        replacement: function (content) {
          if (underlineMode === "drop") return content;
          if (underlineMode === "bold") return "**" + content + "**";
          return "<u>" + content + "</u>";
        }
      });

      return turndownService.turndown(html);
    }

    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadRawHtml() {
      setStatus("Reading raw HTML…");
      Office.context.mailbox.item.body.getAsync(Office.CoercionType.Html, {}, function (result) {
        if (result.status !== Office.AsyncResultStatus.Succeeded) {
          setStatus("Failed to read email body: " + result.error.message, "error");
          return;
        }
        downloadFile("raw-office-js-body.html", result.value);
        setStatus("Downloaded raw HTML as returned by Office.js.", "ok");
      });
    }

    function exportEmail() {
      const btn = document.getElementById("export-btn");
      const underlineMode = document.getElementById("underline-mode").value;
      btn.disabled = true;
      setStatus("Reading email body…");

      const item = Office.context.mailbox.item;

      item.body.getAsync(Office.CoercionType.Html, {}, function (result) {
        btn.disabled = false;
        if (result.status !== Office.AsyncResultStatus.Succeeded) {
          setStatus("Failed to read email body: " + result.error.message, "error");
          return;
        }

        try {
          const frontmatter = buildFrontmatter(item);
          const preprocessedHtml = mergeTightParagraphs(result.value);
          const markdownBody = convertHtmlToMarkdown(preprocessedHtml, underlineMode);
          const fullMarkdown = frontmatter + markdownBody + "\n";

          const dateStr = item.dateTimeCreated
            ? item.dateTimeCreated.toISOString().slice(0, 10)
            : "0000-00-00";
          const filename = `${dateStr} ${sanitizeFilename(item.subject)}.md`;

          downloadFile(filename, fullMarkdown);
          setStatus("Exported: " + filename, "ok");
        } catch (e) {
          setStatus("Conversion error: " + e.message, "error");
        }
      });
    }
  </script>
</body>
</html>
